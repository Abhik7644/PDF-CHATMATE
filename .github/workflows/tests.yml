name: PDF ChatMate Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # ==========================================
  # Backend Tests
  # ==========================================

  backend-tests:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/test_pdf_processor.py
          pytest tests/test_rag.py
          pytest tests/test_api.py


  # ==========================================
  # Selenium End-to-End Test
  # ==========================================

  selenium-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start FastAPI backend
        env:
          PYTHONPATH: ${{ github.workspace }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: |
          nohup python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &

      - name: Start Streamlit frontend
        run: |
          nohup streamlit run frontend.py --server.address 0.0.0.0 --server.port 8501 > frontend.log 2>&1 &

      - name: Wait for applications
        run: |
          sleep 10

      - name: Run Selenium tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/test_selenium.py